; Standard.cfg
; Configuration file (Cutlist Manager) for Export as a
; ***********************************
; * Standard Comma Delimmited Table *
; ***********************************
;
; ============================================================================
; EXPORT_CSV_CUT_RITE_LE_V2.cfg - 29-10-2026 - ronda 2 (colunas finais)
; Cópia do EXPORT_CSV_CUT_RITE_LE.cfg (o que está em uso) com estas mudanças:
;  1) A coluna "RP" passa a chamar-se "Artigo" (o conteúdo é o mesmo: o
;     artigo principal, SPLITLEFT[PARTPOSSTR;.]).
;  2) Coluna nova "SubArtigo", logo à direita de Artigo = ARTNR, o artigo mais
;     próximo da peça: o sub-artigo quando a peça está dentro de um (ex.:
;     BL_3GVT_RP_01 dentro do RP_A_01_ESQ); senão o próprio artigo principal.
;  3) Saíram as colunas CNC, ABD e BHT (nunca tiveram dados).
;  4) ACCUMULATE com ARTNR_NR_ID (o artigo onde a peça está): sem isto, peças
;     iguais de sub-artigos de RPs diferentes juntavam-se numa só linha com o RP
;     da primeira (ex.: obra CRW_2128_2711_01, 18 laterais de gaveta no RP_01
;     quando são 6 em cada RP_01/02/03).
; Ordem: Descricao..Cliente (1-15, iguais) | Artigo | SubArtigo | Notas | Notas_1
;        | Cliente_Final
; ATENÇÃO: as colunas 17 a 20 mudaram de sítio e "RP" mudou de nome. O modelo da
; Lista Material (macro Import_CSV_Imos_1) ainda NÃO está adaptado: até lá, usar
; este .cfg só em obras de teste (o ficheiro tem o mesmo nome do CSV normal).
; Fonte com histórico: Martelo_Orcamentos_V3\scripts\imos_cfg\ (README.md).
; ============================================================================

[CONFIG]
SORT=""
FILTER="(CUT_FLAG <> 0 OR CUT_FLAG IS NULL) AND TYP <> 11 AND TYP <> 15 AND TYP <> 16 AND TYP <> 17 AND TYP <> 18 AND TYP <> 19 AND TYP <> 20 AND TYP <> 43 AND TYP <> 44"

FILTER_CONNECTOR = "TYP = 11 OR TYP = 15 OR TYP = 16 OR TYP = 17 OR TYP = 18 OR TYP = 19 OR TYP = 20 OR TYP = 43 OR TYP = 44"

;Material depending sorting (0=one file for all materials, 1=for every material a new file)
SORT_MAT=0

;No Typfile
ORDERFILENAME=
ORDERFILESUFFIX=

;Surface materials
SURF_MAT=0
SURFTFILENAME=
SURFBFILENAME=

;Read the MID file (0=no, 1=yes)
READ_MID_FILE=0

;The file name is the PO number
PARTFILENAME=AUFTRAG
PARTFILESUFFIX=_Lista_Corte.csv    

;PARTFILENAME=REPLACE_EMPTY[_PROJECT;AUFTRAG]  
;Se pretender no Organaizer tirar a listagem da pasta que contem todas as subencomendas dentro devo ativar  PARTFILENAME=REPLACE_EMPTY[_PROJECT;AUFTRAG]  e colocar como comentario o que está em cima -> ;The file name is the PO number

;Subfolder
;SUBDIRNAME=_PROJECT

;Length of the filename
FILENAMELENGTH=30

;Folder to store the CutList files, Folder must exist
LOCATION = W:\WoodCADCAM 2018\CutRite

;Rotation of the material to get the grain direction as the X direction (0=no, 1=yes)
ALIGN_MAT=1
;Rotation of the top surface to get the grain direction as the X direction (0=no, 1=yes)
ALIGN_SURFT=1
;Rotation of the bottom surface to get the grain direction as the X direction (0=no, 1=yes)
ALIGN_SURFB=1

;no message, that a parts list got generated successfully
NONSTOP=0

;Append this parts list to an existing one. 0 = no, 1 = yes
APPEND_MODE=0

;This will group connectors to each article.

;Original (até à V2): ACCUMULATE=CPID;MATID;FLENG;FWIDTH;INFO5;POSSTR;NAME1;AUFTRAG
; V2: + ARTNR_NR_ID, para não juntar peças de sub-artigos de RPs diferentes
ACCUMULATE=CPID;MATID;FLENG;FWIDTH;INFO5;POSSTR;NAME1;AUFTRAG;ARTNR_NR_ID
;ACCUMULATE_CONNECTORS=AUFTRAG;NAME1;MATID;MATNAME;ARTNR;CPID
POSITION_SORT=1
SORT_POSITIONS = POSSTR
;ONLY_TOP_ARTICLES=1
;CONNECTORS_PER_POSITION=1

[ORDER_HEADER]
STRING_ORDER_HEADER=

[ORDER_PART]
STRING_ORDER=
STRING_ORDER_SURFT=
STRING_ORDER_SURFB=

; Sequence for the Fields in the sections [HEADER] and [PART]:
;   1. IMOS Part ID (PART_ID, %s)
;   2. Name (AUFTRAG, %s)
;   3. Qty (CNT, %-.0f)
;   4. Typ (TYP, %d)
;   5. Part Name (NAME1, %s)
;   6. Construction Principle,
;      does not work for the Drawer Box Module (KPNAME, %s)
;   7. Material (MATID, %s)
;   8. Material Description (MATNAME, %s)
;   9. Material Grain Index (MATGRID, %s)
;  10. Material Grain Angle (MATGROR, %.2f)
;  11. Material Grain Direction in Ardis Format
;      (ARDISMATGRAIN, 0 = no Grain, 1 = 0 degree, 2 = 90 degree, %s)
;  12. Surface Top (SURFTID, %s)
;  13. Surface Top Description (SURFTNAM, %s)
;  14. Surface Top Grain Index (SURFTGRID, %s)
;  15. Surface Top Grain Angle (SURFTGROR, %.2f)
;  16. Surface Top Grain Direction
;      (ARDISSURFTGRAIN, 0 = no Grain, 1 = 0 degree, 2 = 90 degree, %s)
;  17. Surface Top Length (SURFTLEN, %.1f)
;  18. Surface Top Width (SURFTWIDTH, %.1f)
;  19. Surface Top Thickness (SURFTTHK, %.1f)
;  20. Surface Bottom (SURFBID, %s)
;  21. Surface Bottom Description (SURFBNAM, %s)
;  22. Surface Bottom Grain Index (SURFBGRID, %s)
;  23. Surface Bottom Grain Angle (SURFBGROR, %.2f)
;  24. Surface Bottom Grain Direction
;      (ARDISSURFBGRAIN, 0 = no Grain, 1 = 0 degree, 2 = 90 degree, %s)
;  25. Surface Bottom Length (SURFBLEN, %.1f)
;  26. Surface Bottom Width (SURFBWIDTH, %.1f)
;  27. Surface Bottom Thickness (SURFBTHK, %.1f)
;  28. Finished Length (FLENG, %.1f)
;  29. Finished Width (FWIDTH, %.1f)
;  30. Finished THK (FTHK, %.1f)
;  31. Cut Length (CLENG, %.1f)
;  32. Cut Width (CWIDTH, %.1f)
;  33. Cut THK (CTHK, %.1f)
;  34. Machining Length (RLENG, %.1f)
;  35. Machining Width (RWIDTH, %.1f)
;  36. Machining THK (RTHK, %.1f)
;  37. Special Part Definition
;      (ISPEC, 0 = Standard 4 Edge Part,
;              1 = Part 4 Edges including at least 1 Contour,
;              2 = Special Part with more than 4 Edges,
;              3 = Special Part which is not a Panel, %s)
;  38. Profile 1 (PRFID1, %s)
;  39. Profile Trim 1 (PRFP1, 0=undefined, 1=mitre, 2=short, 3=long, %s)
;  40. Profile Trim Text 1 (PRFPTEXT1, u=undefined, m=mitre, s=short, l=long, %s)
;  41. Profile Sequence 1 (PRFB1,
;                      01. 1=Surface, Edge undefined, 2=Surface before Edge,
;                          3=Edge before Surface,
;                      11. 1=Edge before CNC, 2=Edge on CNC, 3=Edge after CNC, %s)
;  42. Profile CNC Sequence 1 (PRFBAZ1, b=Edge before CNC, o=Edge on CNC, a=Edge after CNC, %s)
;  43. Profile Length 1 (PRFLEN1, %.1f)
;  44. Profile Height 1 (PRFHGT1, %.1f)
;  45. Profile Width 1 (PRFTHK1, %.1f)
;  46. Profile Type 2 (PRFWS1, 0=Machining undefined, 1=Machined Profile,
;                              2=Edgebanded Profile,  3=Pre-Existing Edge,
;                              4=Solid Lumber Edge,   5=Direct Postforming,
;                              6=Softforming,         7=Machining&Edging,
;                              8=Solid&Machining,     %s)
;  47. Profile 2 (PRFID2, %s)
;  48. Profile Trim 2 (PRFP2, 0=undefined, 1=mitre, 2=short, 3=long, %s)
;  49. Profile Trim Text 2 (PRFPTEXT2, u=undefined, m=mitre, s=short, l=long, %s)
;  50. Profile Sequence 2 (PRFB2,
;                      01. 1=Surface, Edge undefined, 2=Surface before Edge,
;                          3=Edge before Surface,
;                      11. 1=Edge before CNC, 2=Edge on CNC, 3=Edge after CNC, %s)
;  51. Profile CNC Sequence 2 (PRFBAZ2, b=Edge before CNC, o=Edge on CNC, a=Edge after CNC, %s)
;  52. Profile Length 2 (PRFLEN2, %.1f)
;  53. Profile Height 2 (PRFHGT2, %.1f)
;  54. Profile Width 2 (PRFTHK2, %.1f)
;  55. Profile Type 2 (PRFWS2, 0=Machining undefined, 1=Machined Profile,
;                              2=Edgebanded Profile,  3=Pre-Existing Edge,
;                              4=Solid Lumber Edge,   5=Direct Postforming,
;                              6=Softforming,         7=Machining&Edging,
;                              8=Solid&Machining,     %s)
;  56. Profile 3 (PRFID3, %s)
;  57. Profile Trim 3 (PRFP3, 0=undefined, 1=mitre, 2=short, 3=long, %s)
;  58. Profile Trim Text 3 (PRFPTEXT3, u=undefined, m=mitre, s=short, l=long, %s)
;  59. Profile Sequence 3 (PRFB3,
;                      01. 1=Surface, Edge undefined, 2=Surface before Edge,
;                          3=Edge before Surface,
;                      11. 1=Edge before CNC, 2=Edge on CNC, 3=Edge after CNC, %s)
;  60. Profile CNC Sequence 3 (PRFBAZ3, b=Edge before CNC, o=Edge on CNC, a=Edge after CNC, %s)
;  61. Profile Length 3 (PRFLEN3, %.1f)
;  62. Profile Height 3 (PRFHGT3, %.1f)
;  63. Profile Width 3 (PRFTHK3, %.1f)
;  64. Profile Type 3 (PRFWS3, 0=Machining undefined, 1=Machined Profile,
;                              2=Edgebanded Profile,  3=Pre-Existing Edge,
;                              4=Solid Lumber Edge,   5=Direct Postforming,
;                              6=Softforming,         7=Machining&Edging,
;                              8=Solid&Machining,     %s)
;  65. Profile 4 (PRFID4, %s)
;  66. Profile Trim 4 (PRFP4, 0=undefined, 1=mitre, 2=short, 3=long, %s)
;  67. Profile Trim Text 4 (PRFPTEXT4, u=undefined, m=mitre, s=short, l=long, %s)
;  68. Profile Sequence 4 (PRFB4,
;                      01. 1=Surface, Edge undefined, 2=Surface before Edge,
;                          3=Edge before Surface,
;                      11. 1=Edge before CNC, 2=Edge on CNC, 3=Edge after CNC, %s)
;  69. Profile CNC Sequence 4 (PRFBAZ4, b=Edge before CNC, o=Edge on CNC, a=Edge after CNC, %s)
;  70. Profile Length 4 (PRFLEN4, %.1f)
;  71. Profile Height 4 (PRFHGT4, %.1f)
;  72. Profile Width 4 (PRFTHK4, %.1f)
;  73. Profile Type 4 (PRFWS4, 0=Machining undefined, 1=Machined Profile,
;                              2=Edgebanded Profile,  3=Pre-Existing Edge,
;                              4=Solid Lumber Edge,   5=Direct Postforming,
;                              6=Softforming,         7=Machining&Edging,
;                              8=Solid&Machining,     %s)
;  74. Area in square meters (AREA, %.3f)
;  75. Price (PRICE, %.3f)
;  76. CNC No, better use '_NCNO1', '_NCNO2', '_NCNO3' (NCNO, %s)
;  77. CNC No 1st CNC Program (_NCNO1, %s)
;  78. CNC No 2nd CNC Program (_NCNO2, %s)
;  79. CNC No 3rd CNC Program (_NCNO3, %s)
;  80. Part Barcode/Part Identification No (BARCODE, %s)
;  81. Barcode 1st CNC Program (LAST[_BARCODE1;8], %s)
;  82. Barcode 2nd CNC Program (LAST[_BARCODE2;8], %s)
;  83. Barcode 3rd CNC Program (LAST[_BARCODE3;8], %s)
;  84. Construction Principle Info 1 (TEXT1, %s)
;  85. Part Info 2 (TEXT2, %s)
;  86. Profile Description 1 (PRFNAME1, %s)   Nome para Orlas 1
;  87. Profile Description 2 (PRFNAME2, %s)  Nome para Orlas 2
;  88. Profile Description 3 (PRFNAME3, %s)  Nome para Orlas 3
;  89. Profile Description 4 (PRFNAME4, %s)  Nome para Orlas 4
;  90. Info Record 'Order No.' (ID_SERIE, %s)
;  91. Info Record 'Comment' (ID_TEXT, %s)
;  92. Info Record CNC Program No. (ID_NCNO, %s)
;  93. Info Record NC Flag (NC_FLAG, %.0f)
;  94. Info Record BoM Flag (BOM_FLAG, %.0f)
;  95. Info Record Cut Flag (CUT_FLAG, %.0f)
;  96. Part Definition Name (KMS, %s)
;  97. Multipart (MPE_TYPE, 0=Single Part, 1=Multiple Part, %d)
;  98. ID of the Parent/Mother of the Multipart (PARENT_ID, %s)
;  99. Veneer Mother ID (VMOTHER_ID, %s)
; 100. Veneer ID (VENEER_ID, %s)
; 101. Flitch ID (FLITCH_ID, %s)
; 102. X-Offset from the left btm. Corner
;       of the Child Part to the 0-Point of the Mother Part (X_VMOTHER, %.1f)
; 103. Y-Offset from the left btm. Corner
;       of the Child Part to the 0-Point of the Mother Part (Y_VMOTHER, %.1f)
; 104. Rotation CCW of the Children Part in the Mother Part (VM_ORIENT, %.1f)
; 105. Assembly Group Name (BGNR, %s)
; 106. Assembly Group No. (BGNR_NR, %d)
; 107. Article Name (ARTNRARTNR, %s)
; 108. Article No. (ARTNR_NR, %d)
; 109. Plan Position Name (POSNR, %s)
; 110. Plan Position No. (POSNR_NR, %d)
; 111. Name of the Vario (CP90NAME, %s)
; 112. Article Width (WIDTH, %.1f)
; 113. Article Depth (DEPTH, %.1f)
; 114. Article Height (HEIGHT, %.1f)
; 115. Info Field 1 (INFO1, %s)
; 116. Info Field 2 (INFO2, %s)
